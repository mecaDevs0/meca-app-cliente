name: meca_app_cliente
description: MECA - App do Cliente para agendamento de serviços automotivos
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.2
  
  # HTTP & API
  dio: ^5.4.0
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Location
  geolocator: ^11.0.0
  google_maps_flutter: ^2.5.3
  
  # Auth
  google_sign_in: ^6.1.6
  sign_in_with_apple: ^5.0.0
  
  # Push Notifications (Comentado temporariamente - conflito de dependências)
  # firebase_core: ^2.24.2
  # firebase_messaging: ^14.7.9
  
  # Payment
  # flutter_pagseguro: ^1.0.0  # Remover se não disponível
  
  # Utils
  intl: ^0.19.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

