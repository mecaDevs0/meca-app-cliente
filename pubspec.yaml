name: meca_app_cliente
description: MECA - App do Cliente para agendamento de serviços automotivos
version: 3.6.0+360

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.2
  
  # HTTP & API
  dio: ^5.4.0
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Location
  geolocator: ^11.0.0
  geocoding: ^2.1.3
  google_maps_flutter: ^2.5.3
  
  # Auth
  
  # Push Notifications
  onesignal_flutter: ^5.0.0
  flutter_local_notifications: ^16.3.0
  permission_handler: ^11.2.0
  
  # Payment
  http: ^1.1.0
  webview_flutter: ^4.10.0
  
  # Utils
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  image_picker: ^1.2.0
  lottie: ^3.1.0
  url_launcher: ^6.2.3
  share_plus: ^10.0.0
  app_links: ^6.3.3
  another_flushbar: ^1.12.30
  local_auth: ^2.1.7
  flutter_secure_storage: ^9.0.0
  timezone: ^0.9.4
  
  # Photo & Image Processing
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5
  camera: ^0.11.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/MIA.svg
    - assets/logos/
    - assets/animations/
