name: meca_app_cliente
description: MECA - App do Cliente para agendamento de serviços automotivos
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.2
  
  # HTTP & API
  dio: ^5.4.0
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Location
  geolocator: ^11.0.0
  geocoding: ^2.1.3
  google_maps_flutter: ^2.5.3
  
  # Auth
  google_sign_in: ^6.1.6
  sign_in_with_apple: ^7.0.1
  
  # Push Notifications (temporariamente comentado para resolver conflito)
  # firebase_core: ^2.24.2
  # firebase_messaging: ^14.7.9
  flutter_local_notifications: ^16.3.0
  permission_handler: ^11.2.0
  
  # Payment
  http: ^1.1.0
  
  # Utils
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.4
  lottie: ^3.1.0
  url_launcher: ^6.2.3
  another_flushbar: ^1.12.30
  local_auth: ^2.1.7
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

